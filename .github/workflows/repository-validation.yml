name: Retag frozen submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Move frozen tag to finalized repository tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TARGET=$(git rev-parse HEAD^)
          echo "Retagging finalized commit: $TARGET"
          git tag -f -a v1.0.0-submission "$TARGET" -m "Frozen submission reproducibility state"
          git push --force origin refs/tags/v1.0.0-submission
