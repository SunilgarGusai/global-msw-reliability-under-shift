name: Repository verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q pipeline/scripts scripts tests

      - name: Validate frozen public artifact
        run: python scripts/validate_public_artifact.py

      - name: Run numerical invariant tests
        run: pytest -q

      - name: Reproduce V2 decision audit
        run: |
          rm -rf results/v2_upgrade_reproduced figures/reproduced
          python pipeline/scripts/11_oof_decision_audit.py --predictions results/verified_baseline/results/primary_logo_predictions.csv --out results/v2_upgrade_reproduced --figures figures/reproduced
          python - <<'PY2'
          import pandas as pd
          from pathlib import Path
          root=Path('.')
          names=['v2_target_severity_audit.csv','v2_target_error_correlations.csv','v2_income_by_target_quartile.csv','v2_prioritization_rank_metrics.csv','v2_service_deficit_threshold_audit.csv','v2_service_deficit_missed_cases.csv','v2_decision_audit_country_rows.csv']
          for n in names:
              a=pd.read_csv(root/'results/v2_upgrade'/n)
              b=pd.read_csv(root/'results/v2_upgrade_reproduced'/n)
              pd.testing.assert_frame_equal(a,b,check_exact=True)
          print('V2 decision audit exact replay: PASS')
          PY2

      - name: Regenerate reviewer-facing figures
        run: python scripts/regenerate_public_figures.py

      - name: Print scientific summary
        run: python scripts/summarize_key_results.py

      - name: Summary
        run: |
          echo '## Global MSW reliability repository verification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Environment installation: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Python syntax: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Frozen numerical invariants: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- SHA-256 integrity: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Exact V2 decision-audit replay: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Public figure regeneration: PASS' >> "$GITHUB_STEP_SUMMARY"
