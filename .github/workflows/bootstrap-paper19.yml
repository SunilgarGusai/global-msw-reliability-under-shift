name: Bootstrap PAPER19 frozen repository

on:
  push:
    paths:
      - '.github/workflows/bootstrap-paper19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap state
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify frozen package
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/package.b64.seg* > /tmp/paper19.b64
          test "$(wc -c < /tmp/paper19.b64)" -eq 2822123
          base64 --decode /tmp/paper19.b64 > /tmp/paper19.zip
          echo "440accc8b5912b7983d18f7c318da7423d394ad3fbd8dd0bd15186314512fa28  /tmp/paper19.zip" | sha256sum -c -
          unzip -t /tmp/paper19.zip
          rm -rf /tmp/paper19-extract
          mkdir -p /tmp/paper19-extract
          unzip -q /tmp/paper19.zip -d /tmp/paper19-extract
          SRC=/tmp/paper19-extract/global-msw-reliability-under-shift
          test -d "$SRC"
          test "$(find "$SRC" -type f | wc -l)" -eq 118
          cd "$SRC"
          sha256sum -c PUBLIC_SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/repository-validation.yml' --exclude='.github/workflows/bootstrap-paper19.yml' "$SRC/" ./
          rm -rf .bootstrap

      - name: Publish repository and frozen release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish frozen PAPER19 reproducibility artifact"
          git push origin HEAD:main
          git tag -f -a v1.0.0-submission -m "Frozen submission reproducibility state"
          git push --force origin refs/tags/v1.0.0-submission
          gh release create v1.0.0-submission /tmp/paper19.zip --title "v1.0.0-submission — Frozen reproducibility archive" --notes-file RELEASE_NOTES_v1.0.0-submission.md
