<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
<title id="title">Global municipal waste reliability workflow</title>
<desc id="desc">Animated high-contrast workflow from public waste and development data through leakage-safe harmonization, geographic holdout, reliability audits, decision analysis, and frozen reproducibility evidence.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
  </marker>
  <filter id="pulseGlow" x="-140%" y="-140%" width="380%" height="380%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1600" height="780" rx="30" fill="#0b1220"/>
<rect x="28" y="28" width="1544" height="724" rx="24" fill="none" stroke="#243244" stroke-width="2"/>

<text x="72" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Reliability-first global MSW prediction workflow</text>
<text x="72" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#cbd5e1">Geographic transfer • subgroup reliability • uncertainty under shift • decision consequences</text>
<line x1="72" y1="142" x2="1528" y2="142" stroke="#243244" stroke-width="2"/>

<text x="78" y="184" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7dd3fc">DATA &amp; TRANSFER</text>
<text x="78" y="475" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#d8b4fe">RELIABILITY AUDIT</text>

<!-- main arrows -->
<path d="M285 285 H360" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M650 285 H735" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1035 285 H1115" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

<!-- branching -->
<path d="M1265 335 C1265 390,1085 405,1060 480" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1265 335 C1265 420,1265 430,1265 480" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1265 335 C1265 390,1440 405,1460 480" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

<!-- audit convergence -->
<path d="M1060 590 C1080 645,1160 650,1215 660" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1265 590 V650" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1460 590 C1435 645,1360 650,1315 660" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

<!-- boxes -->
<rect x="75" y="225" width="210" height="120" rx="18" fill="#172033" stroke="#38bdf8" stroke-width="2.8"/>
<text x="180" y="270" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">Public evidence</text>
<text x="180" y="302" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#cbd5e1">WAW3 / Data360</text>
<text x="180" y="328" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#cbd5e1">+ WDI predictors</text>

<rect x="360" y="225" width="290" height="120" rx="18" fill="#172033" stroke="#60a5fa" stroke-width="2.8"/>
<text x="505" y="270" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">Leakage-safe</text>
<text x="505" y="301" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">harmonization</text>
<text x="505" y="328" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#cbd5e1">fold-specific preprocessing</text>

<rect x="735" y="225" width="300" height="120" rx="18" fill="#172033" stroke="#34d399" stroke-width="2.8"/>
<text x="885" y="270" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">Geographic holdout</text>
<text x="885" y="302" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#d1fae5">leave-one-region-out</text>
<text x="885" y="329" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#cbd5e1">unseen-region evaluation</text>

<rect x="1115" y="225" width="300" height="120" rx="18" fill="#172033" stroke="#f59e0b" stroke-width="2.8"/>
<text x="1265" y="270" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">Frozen out-of-fold</text>
<text x="1265" y="301" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#f8fafc">predictions</text>
<text x="1265" y="328" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fde68a">shared evidence base</text>

<rect x="900" y="480" width="320" height="110" rx="18" fill="#10243d" stroke="#38bdf8" stroke-width="2.8"/>
<text x="1060" y="523" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" fill="#f8fafc">Point-model &amp;</text>
<text x="1060" y="553" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" fill="#f8fafc">subgroup reliability</text>
<text x="1060" y="578" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#bae6fd">error • bias • transfer</text>

<rect x="1115" y="480" width="300" height="110" rx="18" fill="#24163a" stroke="#c084fc" stroke-width="2.8"/>
<text x="1265" y="523" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" fill="#f8fafc">Uncertainty under shift</text>
<text x="1265" y="553" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#e9d5ff">conformal • OOD • selective</text>
<text x="1265" y="578" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#c4b5fd">diagnostic, not causal</text>

<rect x="1320" y="480" width="240" height="110" rx="18" fill="#2a1d16" stroke="#fb923c" stroke-width="2.8"/>
<text x="1440" y="523" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" fill="#f8fafc">Robustness &amp;</text>
<text x="1440" y="553" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" fill="#f8fafc">decision audit</text>
<text x="1440" y="578" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fed7aa">severity • prioritization</text>

<rect x="1115" y="650" width="300" height="82" rx="18" fill="#102b24" stroke="#34d399" stroke-width="2.8"/>
<text x="1265" y="684" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" fill="#f8fafc">Auditable frozen evidence</text>
<text x="1265" y="711" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#d1fae5">tables • figures • checksums • CI</text>

<!-- hidden motion paths -->
<path id="dataPath" d="M180 285 C300 285,380 285,505 285 S760 285,885 285 S1130 285,1265 285" fill="none" stroke="none"/>
<path id="reliabilityPath" d="M1265 285 C1265 390,1110 420,1060 535 S1120 660,1265 690" fill="none" stroke="none"/>
<path id="uncertaintyPath" d="M1265 285 C1265 390,1265 430,1265 535 S1265 625,1265 690" fill="none" stroke="none"/>
<path id="decisionPath" d="M1265 285 C1265 390,1410 425,1440 535 S1370 650,1265 690" fill="none" stroke="none"/>

<!-- animated pulses -->
<circle r="10" fill="#38bdf8" opacity="0" filter="url(#pulseGlow)">
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="6.6s" repeatCount="indefinite"/>
  <animateMotion dur="6.6s" repeatCount="indefinite"><mpath href="#dataPath"/></animateMotion>
</circle>
<circle r="9" fill="#38bdf8" opacity="0" filter="url(#pulseGlow)">
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.18;0.28;0.9;1" dur="7.2s" begin="1.0s" repeatCount="indefinite"/>
  <animateMotion dur="7.2s" begin="1.0s" repeatCount="indefinite"><mpath href="#reliabilityPath"/></animateMotion>
</circle>
<circle r="9" fill="#c084fc" opacity="0" filter="url(#pulseGlow)">
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.18;0.28;0.9;1" dur="7.2s" begin="1.7s" repeatCount="indefinite"/>
  <animateMotion dur="7.2s" begin="1.7s" repeatCount="indefinite"><mpath href="#uncertaintyPath"/></animateMotion>
</circle>
<circle r="9" fill="#fb923c" opacity="0" filter="url(#pulseGlow)">
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.18;0.28;0.9;1" dur="7.2s" begin="2.4s" repeatCount="indefinite"/>
  <animateMotion dur="7.2s" begin="2.4s" repeatCount="indefinite"><mpath href="#decisionPath"/></animateMotion>
</circle>

<text x="78" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#94a3b8">Animated path highlighting is decorative; the scientific workflow and frozen calculations are unchanged.</text>
</svg>